<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14365d">
  <meta name="description" content="Referto elettronico per le gare di Minibasket FIP della Polisportiva Senna: segnapunti, regole per categoria ed esportazione del referto ufficiale.">
  <meta name="author" content="Polisportiva Senna">
  <title>Referto Minibasket</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-48.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="btnHome" title="Partite" aria-label="Partite">

    </button>
    <img class="brand-logo" src="icons/logo-senna.png" alt="Polisportiva Senna" width="34" height="34">
    <div class="brand" id="brand">Referto Minibasket</div>
    <button class="sync-badge" id="syncBadge" title="Salvataggio cloud">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
      <span id="syncText">Locale</span>
    </button>
    <button class="icon-btn" id="btnSettings" title="Impostazioni" aria-label="Impostazioni">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 .05-.94 7.07 7.07 0 0 0-.05-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54A.48.48 0 0 0 13.92 2h-3.84a.48.48 0 0 0-.48.41l-.36 2.54a7.3 7.3 0 0 0-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.72 8.47a.48.48 0 0 0 .12.61l2.03 1.58a7.4 7.4 0 0 0 0 1.88l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54c.05.24.25.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54a7 7 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
    </button>
  </header>

  <main id="app"></main>
  <div id="print" aria-hidden="true"></div>
  <div id="modalRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <noscript>Per usare il referto è necessario abilitare JavaScript.</noscript>

  <script src="js/templates.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/xlsx.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
